search_queries:
  - Functional Safety Engineer
  - ISO 26262
  - IEC 61508

countries:

  europe:
    - de
    - gb
    - pl

  north_america:
    - us


search_settings:

  results_per_page: 10

  max_search_calls: 4

  only_new_jobs: true


pipeline:

  run_url_discovery: true

  max_url_discovery_per_run: 3

  run_enrichment: true

  max_enrichment_jobs_per_run: 3

  run_rule_matcher: true

  run_ai_matcher: true

